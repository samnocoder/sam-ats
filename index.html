<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ATS1 — Phase 5</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#f1f5f9;color:#0f172a}
.app{display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
.sidebar{width:220px;flex-shrink:0;background:#0f172a;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,0.06)}
.sb-logo{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:10px}
.sb-logo-icon{width:30px;height:30px;background:#6366f1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;flex-shrink:0;letter-spacing:-1px}
.sb-logo-text{font-size:14px;font-weight:700;color:#f8fafc;letter-spacing:-0.3px}
.sb-logo-badge{font-size:9px;background:rgba(99,102,241,0.3);color:#a5b4fc;padding:1px 5px;border-radius:99px;font-weight:600;margin-left:auto}
.sb-nav{flex:1;padding:8px;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.sb-sep{font-size:9px;font-weight:700;color:rgba(148,163,184,0.4);text-transform:uppercase;letter-spacing:0.08em;padding:10px 8px 4px}
.nav-btn{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;cursor:pointer;color:#94a3b8;font-size:12.5px;font-weight:500;background:none;border:none;width:100%;text-align:left;transition:all .15s;font-family:inherit}
.nav-btn:hover{background:rgba(255,255,255,0.06);color:#e2e8f0}
.nav-btn.active{background:rgba(99,102,241,0.15);color:#a5b4fc}
.nav-icon{width:16px;text-align:center;flex-shrink:0;opacity:0.8}
.nav-count{margin-left:auto;font-size:10px;font-weight:700;color:rgba(148,163,184,0.5);background:rgba(255,255,255,0.06);padding:1px 6px;border-radius:99px}
.sb-footer{padding:10px;border-top:1px solid rgba(255,255,255,0.06)}
.sb-user{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;cursor:pointer;transition:background .15s}
.sb-user:hover{background:rgba(255,255,255,0.05)}
.sb-avatar{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.sb-uname{font-size:12px;font-weight:600;color:#e2e8f0}
.sb-urole{font-size:10px;color:#64748b}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:0 24px;height:58px;display:flex;align-items:center;gap:12px;flex-shrink:0;z-index:10}
.tb-search{flex:1;max-width:540px;position:relative}
.tb-search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:13px;pointer-events:none}
.tb-search input{width:100%;background:#f8fafc;border:1px solid #e2e8f0;color:#0f172a;padding:8px 40px 8px 34px;border-radius:10px;font-size:13px;font-family:inherit;transition:all .15s}
.tb-search input::placeholder{color:#94a3b8}
.tb-search input:focus{outline:none;border-color:#6366f1;background:#fff;box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.tb-search-kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:10px;color:#94a3b8;background:#f1f5f9;border:1px solid #e2e8f0;padding:1px 5px;border-radius:4px;pointer-events:none}
.tb-nl-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#6366f1;background:#eef2ff;border:1px solid #c7d2fe;padding:3px 8px;border-radius:99px;font-weight:600;white-space:nowrap;cursor:pointer;transition:all .15s}
.tb-nl-tag:hover{background:#e0e7ff}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.tb-date{font-size:11px;color:#94a3b8;white-space:nowrap}

.page-body{flex:1;overflow-y:auto;padding:24px}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.page-title{font-size:20px;font-weight:800;color:#0f172a;letter-spacing:-0.4px}
.page-sub{font-size:12px;color:#64748b;margin-top:2px}

/* BUTTONS */
.btn{padding:7px 14px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;transition:all .15s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;letter-spacing:-0.1px}
.btn-primary{background:#6366f1;color:#fff;box-shadow:0 1px 3px rgba(99,102,241,.3)}
.btn-primary:hover{background:#4f46e5;box-shadow:0 4px 12px rgba(99,102,241,.35);transform:translateY(-1px)}
.btn-secondary{background:#fff;color:#475569;border:1px solid #e2e8f0}
.btn-secondary:hover{background:#f8fafc;border-color:#cbd5e1;color:#0f172a}
.btn-ghost{background:none;color:#64748b;border:none}
.btn-ghost:hover{color:#0f172a;background:#f1f5f9}
.btn-danger{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.btn-danger:hover{background:#fecaca}
.btn-success{background:#d1fae5;color:#065f46;border:1px solid #a7f3d0}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-xs{padding:2px 8px;font-size:11px;border-radius:6px}

/* CARDS */
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card-sm{padding:14px}

/* STATS */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#6366f1,#8b5cf6);border-radius:12px 12px 0 0}
.stat-num{font-size:24px;font-weight:800;color:#0f172a;letter-spacing:-0.5px;line-height:1.1}
.stat-label{font-size:10px;font-weight:700;color:#94a3b8;margin-top:5px;text-transform:uppercase;letter-spacing:.05em}
.stat-green .stat-num{color:#059669}
.stat-yellow .stat-num{color:#d97706}
.stat-purple .stat-num{color:#7c3aed}

/* TABLE */
.table-wrap{overflow-x:auto;border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 14px;color:#64748b;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid #e2e8f0;background:#f8fafc;white-space:nowrap;cursor:pointer;user-select:none;transition:color .15s}
th:hover{color:#0f172a}
td{padding:11px 14px;border-bottom:1px solid #f1f5f9;vertical-align:middle;color:#0f172a}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover td{background:#fafbff}
tbody tr:last-child td{border-bottom:none}
.col-check{width:38px;cursor:default !important}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-applied{background:#d1fae5;color:#065f46;border:1px solid #a7f3d0}
.badge-sourced{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0}
.badge-screening{background:#eef2ff;color:#4338ca}
.badge-submitted{background:#dbeafe;color:#1d4ed8}
.badge-interview{background:#fef3c7;color:#92400e}
.badge-offer{background:#ede9fe;color:#5b21b6}
.badge-placed{background:#d1fae5;color:#065f46}
.badge-rejected{background:#fee2e2;color:#991b1b}
.badge-ta{background:#eef2ff;color:#4338ca;border:1px solid #c7d2fe}
.badge-tb{background:#d1fae5;color:#065f46;border:1px solid #a7f3d0}
.badge-tc{background:#f8fafc;color:#64748b;border:1px solid #e2e8f0}
.badge-high{background:#fee2e2;color:#991b1b}
.badge-medium{background:#fef3c7;color:#92400e}
.badge-low{background:#f1f5f9;color:#475569}
.badge-active{background:#d1fae5;color:#065f46}
.badge-filled{background:#dbeafe;color:#1d4ed8}
.badge-onhold{background:#fef3c7;color:#92400e}
.badge-t1{background:#eef2ff;color:#4338ca;border:1px solid #c7d2fe}
.badge-t2{background:#d1fae5;color:#065f46;border:1px solid #a7f3d0}

/* FILTERS */
.filter-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filter-select{background:#fff;border:1px solid #e2e8f0;color:#475569;padding:6px 10px;border-radius:8px;font-size:12px;font-family:inherit;font-weight:500;cursor:pointer;transition:all .15s}
.filter-select:focus{outline:none;border-color:#6366f1}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;background:#eef2ff;color:#4338ca;border:1px solid #c7d2fe;border-radius:99px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
.chip:hover{background:#e0e7ff}

/* BULK BAR */
.bulk-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#eef2ff;border-radius:10px;margin-bottom:12px;border:1px solid #c7d2fe}
.bulk-label{font-size:13px;font-weight:600;color:#4338ca;flex:1}

/* MATCH BAR */
.match-bar{height:4px;background:#e2e8f0;border-radius:99px;overflow:hidden;flex-shrink:0}
.match-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#6366f1,#8b5cf6)}

/* STALE */
.stale-badge{font-size:10px;background:#fef3c7;color:#92400e;padding:2px 6px;border-radius:99px;font-weight:600;border:1px solid #fde68a}

/* ROW ACTION */
.row-action{font-size:12px;font-weight:600;color:#6366f1;background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:6px;transition:all .15s;font-family:inherit}
.row-action:hover{background:#eef2ff;color:#4338ca}

/* KANBAN */
.kanban-wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
.kanban-col{background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;overflow:hidden}
.kanban-col-hdr{padding:12px 14px;border-bottom:1px solid #e2e8f0;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px}
.kanban-col-name{font-size:13px;font-weight:700;color:#0f172a}
.kanban-col-sub{font-size:10px;color:#94a3b8;margin-top:1px}
.kanban-col-count{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px}
.kanban-col-body{padding:8px;display:flex;flex-direction:column;gap:7px;min-height:120px;transition:all .15s;border-radius:8px}
.kanban-col-body.drag-over{background:#eef2ff;outline:2px dashed #6366f1;outline-offset:-3px}
.kcard{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:12px;cursor:grab;transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.kcard:hover{border-color:#6366f1;box-shadow:0 4px 14px rgba(99,102,241,.14);transform:translateY(-1px)}
.kcard:active{cursor:grabbing}
.kcard.dragging{opacity:.45;transform:rotate(1deg) scale(.97)}
.kcard-name{font-size:13px;font-weight:700;color:#0f172a;margin-bottom:2px}
.kcard-role{font-size:11px;color:#64748b;margin-bottom:4px}
.kcard-rec{font-size:10px;color:#94a3b8;margin-bottom:8px}
.kcard-foot{display:flex;align-items:center;justify-content:space-between;padding-top:8px;border-top:1px solid #f1f5f9}
.kcard-fee{font-size:12px;font-weight:700;color:#059669}
.kcard-stale{border-left:3px solid #fbbf24 !important}
.kcard-hot{border-left:3px solid #ef4444 !important}
.kanban-empty{padding:28px 16px;text-align:center;color:#94a3b8;font-size:12px}

/* SLIDE-OVER */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(2px);z-index:100;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:all}
.slideover{position:fixed;top:0;right:0;height:100%;width:520px;max-width:100%;background:#fff;border-left:1px solid #e2e8f0;z-index:101;transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);overflow-y:auto;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.12)}
.slideover.open{transform:translateX(0)}
.so-hdr{padding:18px 22px;border-bottom:1px solid #e2e8f0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;position:sticky;top:0;background:#fff;z-index:2}
.so-hdr-meta{flex:1;min-width:0}
.so-name{font-size:17px;font-weight:800;color:#0f172a;letter-spacing:-0.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.so-sub{font-size:12px;color:#64748b;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.so-hdr-btns{display:flex;align-items:center;gap:5px;flex-shrink:0}
.so-close{background:#f1f5f9;border:none;color:#64748b;cursor:pointer;font-size:14px;padding:6px 8px;border-radius:8px;line-height:1;transition:all .15s;font-family:inherit}
.so-close:hover{background:#e2e8f0;color:#0f172a}
.so-stage-bar{padding:10px 22px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#f8fafc}
.stage-btn{padding:4px 11px;border-radius:99px;border:1px solid #e2e8f0;background:#fff;color:#475569;cursor:pointer;font-size:11px;font-weight:600;transition:all .15s;font-family:inherit}
.stage-btn:hover{border-color:#6366f1;color:#6366f1;background:#eef2ff}
.stage-btn.active{background:#6366f1;color:#fff;border-color:#6366f1}
.so-tabs{display:flex;border-bottom:1px solid #e2e8f0;padding:0 22px;background:#fff;overflow-x:auto}
.so-tab{padding:11px 13px;font-size:12.5px;font-weight:500;color:#64748b;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit;transition:all .15s}
.so-tab:hover{color:#0f172a}
.so-tab.active{color:#6366f1;border-bottom-color:#6366f1;font-weight:600}
.so-body{padding:22px;flex:1}
.so-sec{margin-bottom:22px}
.so-sec-title{font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.so-row{display:flex;gap:8px;margin-bottom:7px;font-size:13px;align-items:flex-start}
.so-lbl{color:#94a3b8;width:88px;flex-shrink:0;font-size:11px;padding-top:1px}
.so-val{color:#0f172a;flex:1}
.so-notes-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px}
.so-notes-box textarea{background:transparent;border:none;color:#475569;font-size:13px;line-height:1.7;resize:vertical;width:100%;min-height:90px;outline:none;font-family:inherit}

/* TIMELINE */
.tl-item{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid #f1f5f9}
.tl-dot{width:8px;height:8px;border-radius:50%;background:#6366f1;margin-top:5px;flex-shrink:0}
.tl-dot.green{background:#10b981}.tl-dot.yellow{background:#f59e0b}.tl-dot.red{background:#ef4444}.tl-dot.gray{background:#94a3b8}
.tl-text{font-size:12px;color:#475569;line-height:1.5}
.tl-time{font-size:11px;color:#94a3b8;margin-top:2px}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border:1px solid #e2e8f0;border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:slideUp .2s ease}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-hdr{padding:18px 22px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:15px;font-weight:700;color:#0f172a}
.modal-body{padding:20px 22px;display:flex;flex-direction:column;gap:13px}
.modal-foot{padding:14px 22px;border-top:1px solid #e2e8f0;display:flex;justify-content:flex-end;gap:10px}
.form-field{display:flex;flex-direction:column;gap:4px}
.form-label{font-size:10.5px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em}
.form-input{background:#f8fafc;border:1px solid #e2e8f0;color:#0f172a;padding:8px 11px;border-radius:8px;font-size:13px;font-family:inherit;width:100%;transition:all .15s}
.form-input:focus{outline:none;border-color:#6366f1;background:#fff;box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.form-input::placeholder{color:#94a3b8}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* COMMAND PALETTE */
.cmd-overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);z-index:300;display:flex;align-items:flex-start;justify-content:center;padding-top:80px;animation:fadeIn .1s ease}
.cmd-box{background:#fff;border:1px solid #e2e8f0;border-radius:16px;width:100%;max-width:580px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.2);animation:slideUp .15s ease}
.cmd-input-row{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid #e2e8f0}
.cmd-search-icon{color:#94a3b8;font-size:15px;flex-shrink:0}
.cmd-input{background:none;border:none;color:#0f172a;font-size:15px;flex:1;outline:none;font-family:inherit}
.cmd-input::placeholder{color:#94a3b8}
.cmd-esc{font-size:10px;color:#94a3b8;background:#f1f5f9;border:1px solid #e2e8f0;padding:2px 6px;border-radius:4px;flex-shrink:0}
.cmd-results{max-height:380px;overflow-y:auto}
.cmd-group-lbl{padding:8px 18px;font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em}
.cmd-item{display:flex;align-items:center;gap:12px;padding:10px 18px;cursor:pointer;transition:background .1s}
.cmd-item:hover,.cmd-item.sel{background:#f8fafc}
.cmd-item-icon{width:32px;height:32px;border-radius:8px;background:#f1f5f9;border:1px solid #e2e8f0;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.cmd-item-label{font-size:13px;font-weight:600;color:#0f172a}
.cmd-item-sub{font-size:11px;color:#64748b}
.cmd-empty{padding:32px;text-align:center;color:#94a3b8;font-size:13px}
.cmd-kbd{margin-left:auto;font-size:10px;color:#94a3b8;background:#f1f5f9;border:1px solid #e2e8f0;padding:2px 6px;border-radius:4px}

/* TOAST */
.toast-wrap{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:500;pointer-events:none}
.toast{padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.12);animation:slideIn .2s ease;pointer-events:all;border:1px solid;font-family:inherit}
@keyframes slideIn{from{transform:translateX(80px);opacity:0}to{transform:translateX(0);opacity:1}}
.toast-success{background:#d1fae5;color:#065f46;border-color:#a7f3d0}
.toast-error{background:#fee2e2;color:#991b1b;border-color:#fecaca}
.toast-info{background:#dbeafe;color:#1d4ed8;border-color:#bfdbfe}

/* FAB */
.fab{position:fixed;bottom:28px;right:28px;width:50px;height:50px;border-radius:15px;background:#6366f1;color:#fff;border:none;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(99,102,241,.45);transition:all .2s;z-index:50;font-family:inherit;line-height:1}
.fab:hover{transform:translateY(-2px) scale(1.06);box-shadow:0 12px 32px rgba(99,102,241,.55);background:#4f46e5}

/* ANALYTICS */
.analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.chart-title{font-size:13px;font-weight:700;color:#0f172a;margin-bottom:12px}
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:150px;padding:0 4px}
.bar-col{display:flex;flex-direction:column;align-items:center;flex:1;gap:4px;height:100%}
.bar-val{font-size:10px;color:#64748b;flex-shrink:0}
.bar-wrap{width:100%;flex:1;display:flex;align-items:flex-end}
.bar-fill{width:100%;border-radius:4px 4px 0 0;min-height:2px;transition:height .3s}
.bar-label{font-size:10px;color:#94a3b8;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;flex-shrink:0}

/* SETTINGS */
.settings-sec-title{font-size:13px;font-weight:700;color:#0f172a;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #e2e8f0}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f1f5f9;gap:16px}
.settings-label{font-size:13px;font-weight:600;color:#0f172a}
.settings-desc{font-size:11px;color:#64748b;margin-top:2px}
.toggle{position:relative;width:38px;height:21px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:#e2e8f0;border-radius:21px;cursor:pointer;transition:.2s}
.toggle-slider::before{content:'';position:absolute;height:15px;width:15px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked+.toggle-slider{background:#6366f1}
.toggle input:checked+.toggle-slider::before{transform:translateX(17px)}

/* SUBMISSIONS */
.sub-group-hdr{display:flex;align-items:center;gap:10px;padding:11px 16px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:8px;cursor:pointer;transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.sub-group-hdr:hover{background:#f8fafc;border-color:#cbd5e1}

/* EMPTY STATE */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;text-align:center}
.empty-icon{font-size:40px;margin-bottom:14px;opacity:.6}
.empty-title{font-size:15px;font-weight:700;color:#0f172a;margin-bottom:6px}
.empty-desc{font-size:13px;color:#64748b;max-width:280px;line-height:1.6}

/* EMAIL */
.email-preview{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:16px;font-size:13px;line-height:1.8;color:#475569;white-space:pre-wrap;font-family:inherit;max-height:300px;overflow-y:auto}

/* NL RESULT BANNER */
.nl-banner{display:flex;align-items:center;gap:6px;padding:8px 14px;background:#eef2ff;border:1px solid #c7d2fe;border-radius:8px;font-size:12px;color:#4338ca;font-weight:600;margin-bottom:12px}

@media(max-width:1100px){.kanban-wrap{grid-template-columns:1fr 1fr}.analytics-grid{grid-template-columns:1fr}}
@media(max-width:768px){.sidebar{width:56px}.sb-logo-text,.sb-logo-badge,.sb-sep,.nav-count,.sb-uname,.sb-urole,.nav-btn span.nav-lbl{display:none}.kanban-wrap{grid-template-columns:1fr}.slideover{width:100%}.form-row{grid-template-columns:1fr}}

/* RESUME */
.kcard{position:relative}
.resume-badge{position:absolute;top:7px;right:8px;font-size:13px;line-height:1;color:#0d9488;pointer-events:none}
.resume-dropzone{border:2px dashed #e2e8f0;border-radius:10px;padding:22px 16px;text-align:center;color:#94a3b8;font-size:12px;cursor:pointer;transition:all .15s;user-select:none}
.resume-dropzone:hover,.resume-dropzone.drag-active{border-color:#0d9488;color:#0d9488;background:#f0fdfa}
/* WITHIN-COLUMN DRAG INDICATOR */
.kcard.drop-before{border-top:3px solid #6366f1 !important;padding-top:9px}
.kcard.drop-after{border-bottom:3px solid #6366f1 !important;padding-bottom:9px}
/* KANBAN DRAG-AND-DROP */
.kanban-col.kanban-drag-over{outline:2px dashed #6366f1;outline-offset:-2px;background:rgba(99,102,241,0.07);}
.kanban-card[draggable="true"]{cursor:grab;}
.kanban-card[draggable="true"]:active{cursor:grabbing;}
</style>
</head>

function esc(s){if(s==null)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function daysSince(d){if(!d)return 0;return Math.floor((Date.now()-new Date(d).getTime())/86400000);}
function fmtFee(fee,cur){
  var n=Number(fee);
  if(!fee&&fee!==0||isNaN(n)||n===0)return '—';
  return (cur||S.settings.currency)+(n/1000).toFixed(0)+'k';
}
function fmtTier(tier){
  if(tier==='A'||tier==='B')return tier;
  if(typeof tier==='number'&&tier>0)return Math.round(tier*100)+'%';
  return '—';
}
function tierClass(tier){
  if(tier==='A')return 'badge-ta';
  if(tier==='B')return 'badge-tb';
  if(typeof tier==='number'&&tier>=0.5)return 'badge-ta';
  if(typeof tier==='number'&&tier>=0.2)return 'badge-tb';
  return 'badge-tc';
}

function exportCSV(rows,filename){
  if(!rows||!rows.length)return;
  var keys=Object.keys(rows[0]);
  var lines=[keys.join(',')].concat(rows.map(function(r){return keys.map(function(k){var v=String(r[k]||'').replace(/"/g,'""');return '"'+v+'"';}).join(',');}));
  var blob=new Blob([lines.join('\n')],{type:'text/csv'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename+'.csv';a.click();
  toast('Exported '+filename+'.csv','info');
}

/* ═══ NATURAL LANGUAGE SEARCH ═══ */
function parseNL(q){
  if(!q||!q.trim())return null;
  var result={stages:[],text:'',dateRange:null,tier:null,minScore:null};
  var lq=q.toLowerCase().trim();
  lq=lq.replace(/\b(show me|all|candidates?|from|in|the|who are|that are|is|are|with|have|stage|currently|give me|list|find)\b/g,' ');
  STAGES.forEach(function(s){
    if(lq.includes(s.toLowerCase())){result.stages.push(s);lq=lq.replace(new RegExp(s,'gi'),' ');}
  });
  if(/this week/.test(lq)){result.dateRange='this_week';lq=lq.replace('this week',' ');}
  else if(/last week/.test(lq)){result.dateRange='last_week';lq=lq.replace('last week',' ');}
  else if(/last month/.test(lq)){result.dateRange='last_month';lq=lq.replace('last month',' ');}
  else if(/this month/.test(lq)){result.dateRange='this_month';lq=lq.replace('this month',' ');}
  if(/tier a\b|top tier|tier 1\b|\bt1\b/.test(lq)){result.tier='A';lq=lq.replace(/tier a\b|top tier|tier 1\b|\bt1\b/g,' ');}
  else if(/tier b\b|tier 2\b|\bt2\b/.test(lq)){result.tier='B';lq=lq.replace(/tier b\b|tier 2\b|\bt2\b/g,' ');}
  if(/high\s*match|high[\s-]score|top match|strong match/.test(lq)){result.minScore=80;lq=lq.replace(/high\s*match|high[\s-]score|top match|strong match/g,' ');}
  result.text=lq.replace(/\s+/g,' ').trim();
  var hasFilter=result.stages.length||result.dateRange||result.tier||result.text||result.minScore;
  return hasFilter?result:null;
}
function applyNL(candidates,parsed){
  if(!parsed)return candidates;
  var now=new Date();
  var dow=now.getDay();
  var startOfWeek=new Date(now);startOfWeek.setDate(now.getDate()-dow);startOfWeek.setHours(0,0,0,0);
  var startOfMonth=new Date(now.getFullYear(),now.getMonth(),1);
  var startOfLastWeek=new Date(startOfWeek);startOfLastWeek.setDate(startOfWeek.getDate()-7);
  var startOfLastMonth=new Date(now.getFullYear(),now.getMonth()-1,1);
  var endOfLastMonth=new Date(now.getFullYear(),now.getMonth(),0);
  return candidates.filter(function(c){
    if(parsed.stages.length&&parsed.stages.indexOf(c.stage)<0)return false;
    if(parsed.tier){
      var ct=c.tier;
      if(parsed.tier==='A'&&ct!=='A'&&!(typeof ct==='number'&&ct>=0.5))return false;
      if(parsed.tier==='B'&&ct!=='B'&&!(typeof ct==='number'&&ct>=0.2&&ct<0.5))return false;
    }
    if(parsed.dateRange){
      var added=new Date(c.added);
      if(parsed.dateRange==='this_week'&&added<startOfWeek)return false;
      if(parsed.dateRange==='last_week'&&(added<startOfLastWeek||added>=startOfWeek))return false;
      if(parsed.dateRange==='this_month'&&added<startOfMonth)return false;
      if(parsed.dateRange==='last_month'&&(added<startOfLastMonth||added>endOfLastMonth))return false;
    }
    if(parsed.text){
      var lq=parsed.text.toLowerCase();
      if(!c.name.toLowerCase().includes(lq)&&!c.role.toLowerCase().includes(lq)&&!(c.recruiter||'').toLowerCase().includes(lq)&&!(c.location||'').toLowerCase().includes(lq))return false;
    }
    if(parsed.minScore&&(c.matchScore||0)<parsed.minScore)return false;
    return true;
  });
}

/* ═══ BAR CHART ═══ */
function buildBarChart(data,key,fill,fmtFn){
  if(!data||!data.length)return '<div style="color:#94a3b8;font-size:12px;padding:20px;text-align:center">No data</div>';
  var max=0;data.forEach(function(d){if((d[key]||0)>max)max=d[key]||0;});if(!max)max=1;
  return '<div class="bar-chart">'+data.map(function(d){
    var pct=Math.round(((d[key]||0)/max)*100);
    var val=fmtFn?fmtFn(d[key]||0):(d[key]||0);

      {label:'Dashboard',sub:'Overview & stats',icon:'◼',action:"setView('Dashboard');closeCmd()"},
      {label:'Pipeline',sub:'Kanban view',icon:'⊟',action:"setView('Pipeline');closeCmd()"},
      {label:'Candidates',sub:'All candidates',icon:'◉',action:"setView('Candidates');closeCmd()"},
      {label:'Roles',sub:'Open roles',icon:'▣',action:"setView('Roles');closeCmd()"},
      {label:'Submissions',sub:'Submission tracker',icon:'▷',action:"setView('Submissions');closeCmd()"},
      {label:'Analytics',sub:'Charts & stats',icon:'▲',action:"setView('Analytics');closeCmd()"},
      {label:'Settings',sub:'Configure ATS',icon:'◎',action:"setView('Settings');closeCmd()"}
    ];
  } else {
    S.candidates.filter(function(c){return c.name.toLowerCase().includes(lq)||c.role.toLowerCase().includes(lq);}).slice(0,5).forEach(function(c){
      items.push({label:c.name,sub:c.role.slice(0,40)+'… · '+c.stage,icon:'👤',action:"openSOById("+sid(c.id)+",'candidate');closeCmd()"});
    });
    S.roles.filter(function(r){return r.title.toLowerCase().includes(lq)||r.company.toLowerCase().includes(lq);}).slice(0,3).forEach(function(r){
      items.push({label:r.title,sub:r.company+' · '+r.status,icon'📋',action:"openSOById("+r.id+",'role');closeCmd()"});
    });
    S.recruiters.filter(function(r){return r.name.toLowerCase().includes(lq)||r.firm.toLowerCase().includes(lq);}).slice(0,3).forEach(function(r){
      items.push({label:r.name,sub:r.firm+' · '+r.tier,icon'🤝',action:"openSOById("+r.id+",'recruiter');closeCmd()"});
    });
  }
  var itemsHtml=items.map(function(it,i){
    return '<div class="cmd-item'+(i===S.cmdSel?' sel':'')+'" onclick="'+esc(it.action)+'" onmouseenter="S.cmdSel='+i+';renderCmd()">'+
      '<div class="cmd-item-icon">'+esc(it.icon)+'</div>'+
      '<div><div class="cmd-item-label">'+esc(it.label)+'</div><div class="cmd-item-sub">'+esc(it.sub)+'</div></div>'+
      (it.kbd?'<span class="cmd-kbd">'+esc(it.kbd)+'</span>':'')+
    '</div>';
  }).join('');
  return '<div class="cmd-overlay" onclick="if(event.target===this)closeCmd()">'+
    '<div class="cmd-box">'+
      '<div class="cmd-input-row"><span class="cmd-search-icon">⌕</span>'+
        '<input id="cmd-input" class="cmd-input" placeholder="Search candidates, roles, recruiters…" value="'+esc(S.cmdQ)+'" '+
          'oninput="S.cmdQ=this.value;S.cmdSel=0;renderCmd()" onkeydown="handleCmdKey(event,'+items.length+')"/>'+
        '<span class="cmd-esc">ESC</span>'+
      '</div>'+
      '<div class="cmd-results">'+
        (!lq?'<div class="cmd-group-lbl">Quick Actions</div>':'<div class="cmd-group-lbl">'+items.length+' result'+(items.length!==1?'s':'')+'</div>')+
        (items.length===0?'<div class="cmd-empty">No results for "'+esc(S.cmdQ)+'"</div>':itemsHtml)+
      '</div>'+
    '</div></div>';
}


/* ═══ RENDER FUNCTIONS ═══ */
function renderSidebar(){document.getElementById('sidebar-root').innerHTML=buildSidebar();}
function renderTopbar(){document.getElementById('topbar-root').innerHTML=buildTopbar();}
function renderContent(){
  var h='';
  if(S.view==='Dashboard')h=buildDashboard();
  else if(S.view==='Pipeline')h=buildPipeline();
  else if(S.view==='Candidates')h=buildCandidates();
  else if(S.view==='Roles')h=buildRoles();
  else if(S.view==='Recruiters')h=buildRecruiters();
  else if(S.view==='Submissions')h=buildSubmissions();
  else if(S.view==='Analytics')h=buildAnalytics();
  else if(S.view==='Settings')h=buildSettings();
  document.getElementById('content-root').innerHTML=h;
}
function renderSO(){
  document.getElementById('so-root').innerHTML=buildSO();
  if(S.slideOver&&!S.soOpen){
    requestAnimationFrame(function(){
      var so=document.querySelector('#so-root .slideover');
      var ov=document.querySelector('#so-root .overlay');
      if(so)so.classList.add('open');
      if(ov)ov.classList.add('open');
      S.soOpen=true;
    });
  }
}
function renderModal(){document.getElementById('modal-root').innerHTML=buildModal();}
function renderCmd(){
  document.getElementById('cmd-root').innerHTML=buildCmd();
  if(S.cmdOpen){var i=document.getElementById('cmd-input');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}}
}
function render(){renderSidebar();renderTopbar();renderContent();renderSO();renderModal();renderCmd();}

/* ═══ ACTION FUNCTIONS ═══ */
function setView(v){
  S.view=v;S.selected={};
  renderSidebar();renderTopbar();renderContent();
}
function updateSearch(q){
  S.searchQ=q;
  S.nlParsed=parseNL(q);
  renderTopbar();renderContent();
}
function openSOById(id,type){
  var item;
  if(type==='candidate')item=S.candidates.find(function(c){return sameId(c.id,id);});
  else if(type==='role')item=S.roles.find(function(r){return r.id==id;});
  else if(type==='recruiter')item=S.recruiters.find(function(r){return r.id==id;});
  if(!item)return;
  S.slideOver={type:type,item:item};
  S.soOpen=false;S.soTab='profile';
  S.soNotes=item.notes||'';S.emailDraft='';
  renderSO();
}
var _soClosing=false;
function closeSO(){
  if(_soClosing)return;_soClosing=true;
  var so=document.querySelector('#so-root .slideover');
  var ov=document.querySelector('#so-root .overlay');
  if(so)so.classList.remove('open');
  if(ov)ov.classList.remove('open');
  setTimeout(function(){S.slideOver=null;S.soOpen=false;_soClosing=false;renderSO();},260);
}
function setSOTab(tab){S.soTab=tab;renderSO();}
function updateSONotes(val){
  S.soNotes=val;
  if(S.slideOver&&S.slideOver.type==='candidate'){
    var id=S.slideOver.item.id;
    S.candidates=S.candidates.map(function(c){return sameId(c.id,id)?Object.assign({},c,{notes:val}):c;});
    saveLS('ats1_candidates',S.candidates);
  }
}
function generateEmail(){
  if(!S.slideOver)return;
  var item=S.slideOver.item,type=S.slideOver.type,sig=S.settings.emailSignature||'Best regards';
  if(type==='candidate'){
    S.emailDraft='Subject: Exciting opportunity — '+item.role+'\n\nHi '+item.name.split(' ')[0]+',\n\nI came across your profile and think you\'d be a great fit for a '+item.role+' role I\'m currently working on.\n\nThe position offers a competitive package. Would you be open to a quick call this week?\n\n'+sig;
  } else if(type==='recruiter'){
    S.emailDraft='Subject: Partnership opportunity — '+item.firm+'\n\nHi '+item.name.split(' ')[0]+',\n\nI\'m reaching out from '+S.settings.companyName+'. Given your expertise in '+item.specialization+', I think there\'s strong potential for collaboration.\n\nWould you be open to a 15-min call?\n\n'+sig;
  }
  renderSO();
}
function copyEmail(){
  if(navigator.clipboard&&S.emailDraft){
    navigator.clipboard.writeText(S.emailDraft).then(function(){toast('Copied to clipboard','info');});
  }
}
function updateStage(id,stage){
  var cand=S.candidates.find(function(c){return sameId(c.id,id);});
  S.candidates=S.candidates.map(function(c){return sameId(c.id,id)?Object.assign({},c,{stage:stage}):c;});
  saveLS('ats1_candidates',S.candidates);
  if(cand)logActivity(stage==='Placed'?'🎉':stage==='Offer'?'📋':'🔄',(cand.name||'Candidate')+' → '+stage,cand.role,stage==='Placed'?'green':stage==='Offer'?'yellow':'');
  toast('Moved to '+stage,'info');
  renderContent();renderSO();
}
function openAddModal(){
  S.modal={type:S.view==='Roles'?'role':'candidate'};S.form={};renderModal();
}
function openEditModal(id,type){
  var item;
  if(type==='candidate')item=S.candidates.find(function(c){return sameId(c.id,id);});
  else if(type==='role')item=S.roles.find(function(r){return r.id==id;});
  if(!item)return;
  S.modal={type:type,editId:id};S.form=Object.assign({},item);renderModal();
}
function deleteItem(id,type){
  if(!confirm('Delete this '+type+'? This cannot be undone.'))return;
  if(type==='candidate'){
    S.candidates=S.candidates.filter(function(c){return !sameId(c.id,id);});
    saveLS('ats1_candidates',S.candidates);
    toast('Candidate deleted','info');
  } else if(type==='role'){
    S.roles=S.roles.filter(function(r){return r.id!=id;});
    saveLS('ats1_roles',S.roles);
    toast('Role deleted','info');
  }
  closeSO();renderContent();
}
function closeModal(){S.modal=null;S.form={};renderModal();}
function submitModal(){
  if(!S.modal)return;
  var isEdit=!!S.modal.editId;
  if(S.modal.type==='candidate'){
    if(!S.form.name||!S.form.role){toast('Name and Role are required','error');return;}
    if(isEdit){
      S.candidates=S.candidates.map(function(c){return sameId(c.id,S.modal.editId)?Object.assign({},c,S.form):c;});
      saveLS('ats1_candidates',S.candidates);
      toast('Candidate updated','success');
      if(S.slideOver&&S.slideOver.type==='candidate'&&sameId(S.slideOver.item.id,S.modal.editId)){
        S.slideOver.item=S.candidates.find(function(c){return sameId(c.id,S.modal.editId);});
      }
    } else {
      var nc=Object.assign({stage:'Sourced',tier:'B',fee:0,recruiter:'Unassigned',location:'',linkedin:'',email:'',notes:'',matchScore:70,added:new Date().toISOString().slice(0,10)},S.form,{id:Date.now()});
      S.candidates=S.candidates.concat([nc]);
      saveLS('ats1_candidates',S.candidates);
      logActivity('➕','Candidate added: '+nc.name,nc.role+' · '+nc.stage,'gray');
      toast('Candidate added: '+nc.name);
    }
  } else if(S.modal.type==='role'){
    if(!S.form.title||!S.form.company){toast('Title and Company are required','error');return;}
    if(isEdit){
      S.roles=S.roles.map(function(r){return r.id==S.modal.editId?Object.assign({},r,S.form):r;});
      saveLS('ats1_roles',S.roles);
      toast('Role updated','success');
    } else {
      var nr=Object.assign({status:'Active',priority:'Medium',recruiter:'Unassigned',location:'',salary:'',description:''},S.form,{id:Date.now()});
      S.roles=S.roles.concat([nr]);
      saveLS('ats1_roles',S.roles);
      logActivity('📌','Role added: '+nr.title,nr.company,'gray');
      toast('Role added: '+nr.title);
    }
  }
  S.modal=null;S.form={};renderModal();renderContent();
  if(S.slideOver)renderSO();
}
function setCF(key,val){
  if(key==='stage')S.candidateStage=val;
  if(key==='tier')S.candidateTier=val;
  renderContent();
}
function sortCand(key){
  S.candidateSort={key:key,dir:S.candidateSort.key===key?-S.candidateSort.dir:1};renderContent();
}
function toggleSel(id){
  var k=String(id);
  S.selected=Object.assign({},S.selected);
  S.selected[k]=!S.selected[k];
  renderContent();
}
function toggleAll(ids){
  var allChk=ids.every(function(id){return S.selected[String(id)];});
  S.selected={};
  if(!allChk)ids.forEach(function(id){S.selected[String(id)]=true;});
  renderContent();
}
function applyBulk(){
  var selIds=Object.keys(S.selected).filter(function(k){return S.selected[k];});
  if(!S.candidateBulkStage||!selIds.length)return;
  selIds.forEach(function(id){updateStage(id,S.candidateBulkStage);});
  S.selected={};
  toast('Moved '+selIds.length+' candidates to '+S.candidateBulkStage,'info');
  renderContent();
}
function toggleSubExp(st,wasOpen){
  S.subExp=Object.assign({},S.subExp);S.subExp[st]=!wasOpen;renderContent();
}
function updateSetting(key,val){
  S.settings=Object.assign({},S.settings);S.settings[key]=val;
  saveLS('ats1_settings',S.settings);toast('Saved','info');
}

/* ═══ RESUME HELPERS ═══ */
function hasResume(id){try{return !!localStorage.getItem('ats1_resume_'+id);}catch(e){return false;}}
function getResume(id){try{var s=localStorage.getItem('ats1_resume_'+id);return s?JSON.parse(s):null;}catch(e){return null;}}
function removeResume(id){
  try{localStorage.removeItem('ats1_resume_'+id);}catch(e){}
  toast('Resume removed','info');
  renderContent();renderSO();
}
function triggerResumeUpload(id){
  var inp=document.getElementById('resume-file-input');
  if(!inp)return;
  inp._candidateId=id;
  inp.value='';
  inp.click();
}
function onResumeFileSelected(inp){
  var id=inp._candidateId;
  var file=inp.files&&inp.files[0];
  if(!file||id==null)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    var dataUrl=ev.target.result;
    var obj={filename:file.name,dataUrl:dataUrl,type:file.type,size:file.size};
    try{localStorage.setItem('ats1_resume_'+id,JSON.stringify(obj));}catch(err){toast('File too large for browser storage (try a smaller file)','error');return;}
    autoDownloadResume(id,file.name,dataUrl);
    toast('Resume uploaded','success');
    renderContent();renderSO();
  };
  reader.readAsDataURL(file);
}
function handleResumeDrop(e,id){
  var files=e.dataTransfer&&e.dataTransfer.files;
  if(!files||!files.length)return;
  var file=files[0];
  var reader=new FileReader();
  reader.onload=function(ev){
    var dataUrl=ev.target.result;
    var obj={filename:file.name,dataUrl:dataUrl,type:file.type,size:file.size};
    try{localStorage.setItem('ats1_resume_'+id,JSON.stringify(obj));}catch(err){toast('File too large for browser storage','error');return;}
    autoDownloadResume(id,file.name,dataUrl);
    toast('Resume uploaded','success');
    renderContent();renderSO();
  };
  reader.readAsDataURL(file);
}
function autoDownloadResume(id,origFilename,dataUrl){
  var cand=S.candidates.find(function(c){return sameId(c.id,id);});
  var ext=origFilename.substring(origFilename.lastIndexOf('.'));
  var fname=(cand?cand.name.replace(/[^a-zA-Z0-9]/g,'_'):'Candidate')+'_Resume'+ext;
  var a=document.createElement('a');a.href=dataUrl;a.download=fname;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}
function downloadResume(id){
  var r=getResume(id);if(!r)return;
  autoDownloadResume(id,r.filename,r.dataUrl);
}
function buildResumeSection(item){
  var id=item.id;
  var r=getResume(id);
  var hasImportedNotes=item.notes&&item.notes.startsWith('Summary:');
  var html='<div class="so-sec"><div class="so-sec-title">Resume</div>';
  if(r){
    html+='<div style="background:#f0fdfa;border:1px solid #99f6e4;border-radius:10px;padding:14px">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px">'+
        '<span style="font-size:13px;font-weight:600;color:#0d9488;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">📄 '+esc(r.filename)+'</span>'+
        '<button class="btn btn-danger btn-xs" style="flex-shrink:0" onclick="removeResume('+sid(id)+')">🗑 Remove</button>'+
      '</div>'+
      '<button class="btn btn-secondary btn-sm" onclick="downloadResume('+sid(id)+')">⬇ Download Resume</button>'+
      '<div style="font-size:11px;color:#64748b;margin-top:6px">Also saves to ~/Desktop/ATS_Resumes/ when downloaded</div>'+
    '</div>';
  } else {
    html+='<div class="resume-dropzone" onclick="triggerResumeUpload('+sid(id)+')" '+
      'ondragover="event.preventDefault();this.classList.add(\'drag-active\')" '+
      'ondragleave="this.classList.remove(\'drag-active\')" '+
      'ondrop="event.preventDefault();this.classList.remove(\'drag-active\');handleResumeDrop(event,'+sid(id)+')" '+
      '>'+
        '<div style="font-size:24px;margin-bottom:8px">📂</div>'+
        '<div style="font-weight:600;color:#475569;margin-bottom:3px">Drop resume here or click to upload</div>'+
        '<div style="font-size:11px">PDF, DOC, DOCX, TXT · Stored in browser</div>'+
      '</div>';
  }
  if(hasImportedNotes){
    html+='<div style="margin-top:12px"><div class="so-sec-title" style="margin-top:0">Resume Notes (imported)</div>'+
      '<div class="so-notes-box" style="cursor:default;color:#475569;font-size:12px;line-height:1.7;max-height:200px;overflow-y:auto">'+
        esc(item.notes).replace(/\n/g,'<br>')+
      '</div></div>';
  }
  html+='</div>';
  return html;
}

/* ═══ DRAG & DROP ═══ (handled by document-level delegation below) ═══ */

/* ═══ CMD PALETTE KEYS ═══ */
function openCmd(){S.cmdOpen=true;S.cmdQ='';S.cmdSel=0;renderCmd();}
function closeCmd(){S.cmdOpen=false;S.cmdQ='';renderCmd();}
function handleCmdKey(e,len){
  if(e.key==='ArrowDown'){e.preventDefault();S.cmdSel=Math.min(S.cmdSel+1,len-1);renderCmd();}
  if(e.key==='ArrowUp'){e.preventDefault();S.cmdSel=Math.max(S.cmdSel-1,0);renderCmd();}
  if(e.key==='Enter'){var items=document.querySelectorAll('#cmd-root .cmd-item');if(items[S.cmdSel])items[S.cmdSel].click();}
  if(e.key==='Escape')closeCmd();
}

/* ═══ EXPORTS ═══ */
function exportCandidates(){
  var all=S.nlParsed?applyNL(S.candidates,S.nlParsed):S.candidates;
  var filtered=all.filter(function(c){
    return (S.candidateStage==='All'||c.stage===S.candidateStage)&&(S.candidateTier==='All'||c.tier===S.candidateTier);
  });
  exportCSV(filtered.map(function(c){return {Name:c.name,Role:c.role,Stage:c.stage,Recruiter:c.recruiter,Tier:fmtTier(c.tier),Fee:c.fee,Location:c.location,Match:c.matchScore};}), 'candidates');
}
function exportRoles(){
  exportCSV(S.roles.map(function(r){return {Title:r.title,Company:r.company,Location:r.location,Salary:r.salary,Status:r.status,Priority:r.priority,Recruiter:r.recruiter};}), 'roles');
}
function exportRecruiters(){
  exportCSV(S.recruiters.map(function(r){return {Name:r.name,Firm:r.firm,Tier:r.tier,Location:r.location,Placements:r.placements,Revenue:r.revenue};}), 'recruiters');
}
function exportSubmissions(){
  exportCSV(S.submissions.map(function(s){return {Candidate:s.candidate,Role:s.role,Company:s.company,Recruiter:s.recruiter,Status:s.status,Date:s.date,Fee:s.fee};}), 'submissions');
}

/* ═══ KEYBOARD SHORTCUTS ═══ */
document.addEventListener('keydown',function(e){
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();S.cmdOpen?closeCmd():openCmd();}
  if((e.metaKey||e.ctrlKey)&&e.key==='n'){e.preventDefault();openAddModal();}
  if(e.key==='Escape'){
    if(S.cmdOpen)closeCmd();
    else if(S.modal)closeModal();
    else if(S.slideOver&&!_soClosing)closeSO();
  }
});

/* ═══ INIT ═══ */
(function(){
  var stored=loadLS('ats1_candidates',null);
  var pfCands=initCandidates.filter(function(c){return String(c.id).startsWith('paraform_');});
  if(stored){
    var nonPF=stored.filter(function(c){return !String(c.id).startsWith('paraform_');});
    S.candidates=nonPF.concat(pfCands);
  } else {
    S.candidates=initCandidates;
  }
  /* Ensure every candidate has a sortOrder for within-column reordering */
  var _stageIdx={};
  S.candidates=S.candidates.map(function(c){
    if(c.sortOrder===undefined||c.sortOrder===null){
      _stageIdx[c.stage]=(_stageIdx[c.stage]||0);
      return Object.assign({},c,{sortOrder:_stageIdx[c.stage]++});
    }
    return c;
  });
  saveLS('ats1_candidates',S.candidates);
})();
S.roles=loadLS('ats1_roles',initRoles);
S.recruiters=loadLS('ats1_recruiters',initRecruiters);
S.submissions=loadLS('ats1_submissions',initSubmissions);
S.activity=loadLS('ats1_activity',initActivity);
S.settings=loadLS('ats1_settings',initSettings);

render();

// ── Kanban drag-and-drop (document-level delegation, set up ONCE) ──────────
var _dragId = null;

document.addEventListener('dragstart', function(e) {
  var card = e.target.closest('.kanban-card');
  if (!card) return;
  _dragId = card.dataset.candidateId;
  e.dataTransfer.setData('text/plain', _dragId);
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(function(){ card.style.opacity = '0.4'; }, 0);
});

document.addEventListener('dragend', function(e) {
  var card = e.target.closest('.kanban-card');
  if (card) card.style.opacity = '';
  document.querySelectorAll('.kanban-col').forEach(function(c){ c.classList.remove('kanban-drag-over'); });
  _dragId = null;
});

document.addEventListener('dragover', function(e) {
  var col = e.target.closest('.kanban-col');
  if (!col) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.kanban-col').forEach(function(c){ c.classList.remove('kanban-drag-over'); });
  col.classList.add('kanban-drag-over');
});

document.addEventListener('dragleave', function(e) {
  var col = e.target.closest('.kanban-col');
  if (!col) return;
  if (!col.contains(e.relatedTarget)) col.classList.remove('kanban-drag-over');
});

document.addEventListener('drop', function(e) {
  var col = e.target.closest('.kanban-col');
  if (!col) return;
  e.preventDefault();
  col.classList.remove('kanban-drag-over');
  var id = e.dataTransfer.getData('text/plain') || _dragId;
  var newStage = col.dataset.stage;
  if (!id || !newStage) return;
  var updated = S.candidates.map(function(c) {
    return c.id === id ? Object.assign({}, c, { stage: newStage }) : c;
  });
  // also handle numeric id comparison (some ids are numbers, some strings)
  var changed = updated.some(function(c, i) { return c !== S.candidates[i]; });
  if (!changed) {
    updated = S.candidates.map(function(c) {
      return String(c.id) === String(id) ? Object.assign({}, c, { stage: newStage }) : c;
    });
  }
  S.candidates = updated;
  saveLS('ats1_candidates', S.candidates);
  logActivity('🔄', (S.candidates.find(function(c){ return String(c.id)===String(id); })||{name:'Candidate'}).name+' → '+newStage, newStage, '');
  toast('Moved to '+newStage, 'info');
  renderContent();
});
</script>
